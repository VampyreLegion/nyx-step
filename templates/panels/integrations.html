<!-- Integrations — embedded companion apps -->
  <div class="tab-panel" id="tab-integrations">
    <div class="panel-toolbar">
      <button class="secondary small" onclick="openGuideSection('starthere')" title="Open the Getting Started guide">📖 Guide</button>
    </div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.04em">DOCK STATUS</div>
      <div id="integrations-telemetry" style="font-size:12px;color:var(--muted);min-height:18px">Loading…</div>
    </div>

    <div class="panel-toolbar">
      <span style="font-size:11px;color:var(--muted)">Embedded companion apps run in the same browser session — everything below stays in sync with Nyx-Step.</span>
    </div>

    <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px;background:#000">
      <div style="background:var(--surface);padding:6px 12px;font-size:11px;font-weight:600;color:var(--accent2);letter-spacing:.05em">COMFYUI WORKFLOW</div>
      <iframe
        id="comfyui-iframe"
        style="width:100%;height:820px;border:none;display:block"
        allow="autoplay; clipboard-write"
        title="ComfyUI — build and run diffusion workflows"
      ></iframe>
    </div>

    <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px;background:#000">
      <div style="background:var(--surface);padding:6px 12px;font-size:11px;font-weight:600;color:var(--accent2);letter-spacing:.05em">ACE-STEP GENERATOR</div>
      <iframe
        id="acestep-iframe"
        style="width:100%;height:720px;border:none;display:block"
        allow="autoplay; microphone"
        title="ACE-Step — standalone text-to-music generator"
      ></iframe>
    </div>
  </div>
