  <div class="tab-panel active" id="tab-overview">
    <div class="panel-toolbar">
      <button class="secondary small" onclick="openGuideSection('starthere')" title="Open the Getting Started guide">📖 Guide</button>
    </div>
    <div class="field-group">
      <label>Song Name</label>
      <input type="text" id="song-name" placeholder="e.g. Dark Psy Journey">
    </div>
    <div class="field-group">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <label style="margin:0;color:var(--muted);font-size:12px">Tags <span style="font-size:11px;opacity:0.7">(editable — overrides Style/Instruments/Vocals tabs)</span></label>
        <div style="display:flex;align-items:center;gap:8px">
          <span id="tag-token-count" class="hint" title="Tag token count — warn at 12, hard limit at 15">0 tokens</span>
          <button class="secondary small" id="btn-sync-overview">↺ Sync from tabs</button>
        </div>
      </div>
      <textarea id="overview-tags" rows="2" style="min-height:unset;resize:vertical" placeholder="e.g. psytrance, 140 BPM, C Minor, synthesizer"></textarea>
    </div>
    <div class="field-group">
      <label>Lyrics <span style="font-size:11px;color:var(--muted);opacity:0.7">(editable — synced from Lyrics tab)</span></label>
      <textarea id="overview-lyrics" style="min-height:140px"></textarea>
    </div>
    <div class="field-group">
      <div class="section-title">What gets sent</div>
      <div class="preview-box" id="payload-preview" style="font-size:11px;line-height:1.8;color:var(--text)"></div>
    </div>
    <div style="margin:14px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <select id="generate-engine" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px" title="Choose which AI engine generates the music">
        <option value="ace-step">ACE-Step v1.5</option>
        <option value="minimax">MiniMax Music3</option>
      </select>
      <button id="btn-generate">🎵 Generate Music Idea</button>
      <button class="secondary small" id="btn-save-preset" title="Save all settings to server">💾 Save</button>
      <button class="secondary small" id="btn-load-preset" title="Load a saved preset">📂 Load</button>
      <button class="secondary small" id="btn-clear-overview" title="Clear all fields and reset state">🗑 Clear</button>
      <span id="generate-status" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div id="gen-progress-wrap" style="display:none;margin-bottom:14px">
      <div class="job-progress" style="height:5px;border-radius:3px">
        <div id="gen-progress-bar" class="job-progress-bar"></div>
      </div>
      <div id="gen-progress-label" style="font-size:11px;color:var(--muted);margin-top:4px"></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <span style="font-size:12px;color:var(--muted)">Recent jobs</span>
      <button class="secondary small" id="btn-clear-jobs" title="Clear job list">🗑 Clear list</button>
    </div>
    <div id="jobs-list"></div>
    <div id="ab-compare-panel" style="display:none;background:var(--panel,#15171f);border:1px solid #2d3041;border-radius:8px;padding:10px;margin:8px 0"></div>
