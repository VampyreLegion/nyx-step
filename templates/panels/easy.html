  <div class="tab-panel" id="tab-easy">
    <div class="panel-toolbar">
      <button class="secondary small" onclick="openGuideSection('ch1')" title="Open the Philosophy guide for BioInfusor">📖 Guide</button>
    </div>
    <!-- Quick Idea Starter -->
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.04em">QUICK IDEA STARTER</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input type="text" id="quick-prompt" placeholder="Describe the music… e.g. dark medieval battle drums with choir" style="flex:1;min-width:200px" title="Describe your music in plain English — AI will populate all style, instrument, and parameter fields automatically">
        <select id="quick-model" style="min-width:130px;font-size:12px" title="Ollama model to use for expansion"></select>
        <button class="secondary small" id="btn-quick-expand" title="Use AI to convert your description into structured tags and parameters">✨ Expand</button>
      </div>
      <div id="quick-status" style="font-size:11px;color:var(--muted);margin-top:5px;min-height:14px"></div>
    </div>
    <div class="row">
      <div class="field-group">
        <label>Topic / Prompt</label>
        <input type="text" id="easy-topic" placeholder="e.g. goddess of night, deep space journey">
      </div>
      <div class="field-group">
        <label>Mood</label>
        <input type="text" id="easy-mood" placeholder="e.g. dark, euphoric, melancholic">
      </div>
    </div>
    <div class="row">
      <div class="field-group">
        <label>Subject / Character</label>
        <input type="text" id="easy-subject" placeholder="e.g. Nyx — goddess of night">
      </div>
      <div class="field-group">
        <label>Call them</label>
        <input type="text" id="easy-name-override" placeholder="e.g. Nyx">
      </div>
    </div>
    <div class="row">
      <div class="field-group">
        <label>Style</label>
        <select id="easy-style"><option value="">-- select style --</option></select>
      </div>
      <div class="field-group">
        <label>Structure</label>
        <select id="easy-structure">
          <option>Verse-Chorus</option>
          <option>Verse-Chorus-Bridge</option>
          <option>Intro-Verse-Chorus-Outro</option>
          <option>EDM Structure</option>
          <option>Minimal</option>
        </select>
      </div>
      <div class="field-group">
        <label>Model</label>
        <select id="easy-model"><option>Loading…</option></select>
      </div>
    </div>
    <div id="easy-style-info" style="font-size:12px;color:var(--muted);margin-bottom:8px;display:none"></div>
    <div style="display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:normal">
        <input type="checkbox" id="easy-instrumental"> Instrumental only (no vocals)
      </label>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:normal" title="Auto-inject performance techniques, production effects, and structural tags based on your genre and instruments">
        <input type="checkbox" id="easy-enhance" checked> ✨ Auto-enhance tags
      </label>
    </div>
    <div class="row">
      <div class="field-group">
        <label>Artist / Band <span class="hint">(instruments &amp; lyric style)</span></label>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="text" id="easy-artist" placeholder="e.g. Pink Floyd, Billie Eilish" style="flex:1">
          <label style="display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;cursor:pointer;font-weight:normal">
            <input type="checkbox" id="easy-artist-web"> Web
          </label>
          <button class="secondary small" id="btn-easy-artist-lookup">Look up</button>
        </div>
        <div id="easy-artist-info" style="font-size:12px;color:var(--muted);margin-top:4px;min-height:0"></div>
      </div>
      <div class="field-group">
        <label>Vocal Artist <span class="hint">(vocal style &amp; range)</span></label>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="text" id="easy-vocal-artist" placeholder="e.g. David Bowie, Adele" style="flex:1">
          <label style="display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;cursor:pointer;font-weight:normal">
            <input type="checkbox" id="easy-vocal-web"> Web
          </label>
          <button class="secondary small" id="btn-easy-vocal-lookup">Look up</button>
        </div>
        <div id="easy-vocal-info" style="font-size:12px;color:var(--muted);margin-top:4px;min-height:0"></div>
      </div>
    </div>
    <button id="btn-easy-gen">✨ Generate Music Idea</button>
    <div id="easy-log" class="log-panel" style="margin-top:12px;display:none"></div>
    <!-- Template Starter Kit -->
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px">
        <div class="section-title" style="margin-bottom:0">📦 Template Starter Kit</div>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="text" id="template-name-input" placeholder="Save current as…" style="width:150px;font-size:11px;padding:4px 8px">
          <button class="secondary small" id="btn-template-save-current" title="Save the current state (tags, lyrics, style, parameters) as a reusable template">💾 Save current</button>
        </div>
      </div>
      <div id="template-save-status" style="font-size:11px;color:var(--muted);min-height:14px;margin-bottom:4px"></div>
      <div id="song-templates-panel"></div>
    </div>
