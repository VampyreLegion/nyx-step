  <div class="tab-panel" id="tab-daw">
    <div id="daw-root">
      <div id="daw-transport" style="display:flex;align-items:center;gap:10px;padding:6px 8px;background:#15171f;border:1px solid #2d3041;border-radius:6px;flex-wrap:wrap">
        <select id="daw-project-select" style="font-size:12px;min-width:140px"></select>
        <button class="secondary small" id="daw-new">+ New</button>
        <button class="secondary small" id="daw-rename">✎ Rename</button>
        <button class="secondary small" id="daw-delete">🗑</button>
        <span style="width:1px;height:18px;background:#2d3041"></span>
        <button class="secondary small" id="daw-play">▶</button>
        <button class="secondary small" id="daw-pause">⏸</button>
        <button class="secondary small" id="daw-stop">⏹</button>
        <button class="secondary small" id="daw-loop" title="Loop arrangement">↻</button>
        <span id="daw-time" style="font-family:monospace;font-size:12px;color:var(--muted)">0:00 / 0:00</span>
        <button class="secondary small" id="daw-record-btn" title="Record armed tracks: MIDI in → notes, audio in → clip (arm with ● on a track)">● REC</button>
        <span id="daw-record-status" class="hint"></span>
        <select id="daw-midi-in-select" title="MIDI input device" style="font-size:11px;max-width:130px"><option value="auto">MIDI in: auto</option></select>
        <select id="daw-quant-select" title="Quantize newly recorded MIDI / Hum→MIDI notes to the grid" style="font-size:11px;max-width:86px"><option value="off" selected>Q: Off</option><option value="4">Q: 1/4</option><option value="4t">Q: 1/4t</option><option value="8">Q: 1/8</option><option value="8t">Q: 1/8t</option><option value="16">Q: 1/16</option><option value="16t">Q: 1/16t</option><option value="32">Q: 1/32</option></select>
        <select id="daw-audio-in-select" title="Audio input (mic) for recording" style="font-size:11px;max-width:150px"><option value="">Mic: default</option></select>
        <button class="secondary small" id="daw-mic-btn">🎙 Mic</button>
        <button class="secondary small" id="daw-hum-rec" title="Record the mic into an audio take on a track">🎙 Rec Hum</button>
        <button class="secondary small" id="daw-p2m-toggle" title="Convert the recorded hum into MIDI (key/scale forced)">🎵 Hum→MIDI</button>
        <select id="daw-p2m-key" title="Key the Hum→MIDI output is forced into" style="font-size:11px;max-width:52px"><option value="9" selected>A</option></select>
        <select id="daw-p2m-scale" title="Scale the Hum→MIDI output is forced into" style="font-size:11px;max-width:88px"><option value="major" selected>Major</option></select>
        <button class="secondary small" id="daw-p2m-snap" title="Snap all MIDI note pitches onto the Key / Scale above (works on any MIDI track, not just Hum→MIDI)">♮ Snap</button>
        <span id="daw-p2m-stat" title="Hum capture / conversion status" style="font-size:11px;color:var(--muted);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span>
        <label style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px"><input type="checkbox" id="daw-metronome" checked> Click</label>
        <span style="width:1px;height:18px;background:#2d3041"></span>
        <button class="secondary small" id="daw-monitor-toggle" title="Show/hide MIDI + audio input monitor">📊 Monitor</button>
        <button class="secondary small" id="daw-zoom-out">🔍−</button>
        <button class="secondary small" id="daw-zoom-in">🔍+</button>
        <button class="secondary small" id="daw-mixer-toggle" title="Show/hide mixer">🎚 Mixer</button>
        <button class="secondary small" id="daw-export" title="Render the arrangement to a WAV file">⬇ Export WAV</button>
        <button class="secondary small" id="daw-import-btn" title="Import a WAV/MP3 file into the DAW">⬆ Import Audio</button>
        <input type="file" id="daw-import-file" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a,.opus" style="display:none">
        <button class="secondary small" id="daw-session-toggle" title="Show/hide session looper grid">🎛 Session</button>
        <label style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px"><input type="checkbox" id="daw-snap" checked> Snap</label>
        <select id="daw-snap-res" class="small" style="font-size:11px;width:auto;flex:0 0 auto" title="Snap resolution">
          <option value="bar">Bar</option><option value="half">½</option><option value="beat">Beat</option><option value="quarter">¼</option>
        </select>
        <span id="daw-save-status" style="font-size:11px;color:var(--muted);margin-left:auto">—</span>
      </div>
      <div id="daw-monitor-panel" style="display:none;border:1px solid #2d3041;border-top:none;border-radius:0 0 6px 6px;padding:8px;background:#101218;align-items:stretch">
        <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:stretch">
          <div style="flex:1;min-width:270px;border-right:1px solid #2d3041;padding-right:18px">
            <div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:6px">🎹 MIDI in monitor</div>
            <div id="daw-mon-midi-device" style="font-size:10px;color:var(--muted);margin-bottom:4px"></div>
            <div id="daw-mon-midi-keys" style="position:relative;height:42px;border:1px solid #2d3041;border-radius:4px;background:#000;overflow:hidden"></div>
            <div id="daw-mon-midi-last" style="font-size:10px;color:#a6e3a1;margin-top:5px;min-height:13px;font-family:monospace"></div>
          </div>
          <div style="flex:0 0 250px">
            <div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:6px">🎤 Audio input level</div>
            <div id="daw-mon-mic-meter-wrap" style="height:10px;background:#1a1c26;border:1px solid #2d3041;border-radius:4px;overflow:hidden">
              <div id="daw-mon-mic-meter" style="height:100%;width:0%;background:linear-gradient(90deg,#2ea043,#d29922,#e05f5f)"></div>
            </div>
            <div id="daw-mon-mic-db" style="font-size:11px;color:var(--muted);margin-top:5px;font-family:monospace"></div>
            <div id="daw-mon-mic-device" style="font-size:10px;color:var(--muted);margin-top:3px"></div>
          </div>
        </div>
      </div>
      <div id="daw-arranger" style="display:flex;border:1px solid #2d3041;border-top:none;height:420px;overflow:hidden">
        <div id="daw-track-headers" style="width:150px;flex:0 0 150px;background:#101218;overflow-y:auto;border-right:1px solid #2d3041">
          <div id="daw-tracks-head"></div>
          <button class="secondary small" id="daw-add-track" style="margin:6px;width:calc(100% - 12px)">+ Add Track</button>
          <button class="secondary small" id="daw-add-midi-track" style="margin:0 6px 6px;width:calc(100% - 12px)">+ Add MIDI Track</button>
        </div>
        <div id="daw-timeline-scroll" style="flex:1;overflow:auto;position:relative;background:#0b0c10">
          <canvas id="daw-ruler" height="22" style="display:block;position:sticky;top:0;z-index:2;background:#15171f"></canvas>
          <div id="daw-lanes" style="position:relative"></div>
          <div id="daw-playhead" style="position:absolute;top:0;width:2px;background:#00d4b6;pointer-events:none;z-index:3;display:none"></div>
        </div>
      </div>
      <div id="daw-library" style="border:1px solid #2d3041;border-top:none;border-radius:0 0 6px 6px;padding:6px 8px;max-height:140px;overflow-y:auto">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <strong style="font-size:12px;color:var(--accent2)">📚 Clip Library</strong>
          <input id="daw-lib-search" placeholder="search…" style="font-size:11px;flex:1;max-width:200px">
          <button class="secondary small" id="daw-lib-refresh">↻</button>
        </div>
        <div id="daw-lib-list" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      </div>
      <div id="daw-mixer-panel" style="display:none;border:1px solid #2d3041;border-top:none;border-radius:0 0 6px 6px;padding:8px;background:#101218">
        <strong style="font-size:12px;color:#00d4b6;display:block;margin-bottom:6px">🎚 Mixer</strong>
        <div id="daw-mixer-strips"></div>
      </div>
      <div id="daw-session-panel" style="display:none;border:1px solid #2d3041;border-top:none;border-radius:0 0 6px 6px;padding:8px;background:#101218">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <strong style="font-size:12px;color:#00d4b6">🎛 Session</strong>
          <button class="secondary small" id="daw-session-stopall" style="font-size:11px">⏹ Stop All</button>
          <button class="secondary small" id="daw-session-addscene" style="font-size:11px">+ Scene</button>
        </div>
        <div id="daw-session-grid"></div>
      </div>
      <div id="daw-pianoroll-panel" style="display:none;border:1px solid #2d3041;border-top:none;border-radius:0 0 6px 6px;padding:8px;background:#101218"></div>
    </div>
