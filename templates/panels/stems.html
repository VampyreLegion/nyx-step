  <div class="tab-panel" id="tab-stems">
    <div class="panel-toolbar">
      <button class="secondary small" onclick="openGuideSection('ch6')" title="Open Operations guide">📖 Guide</button>
    </div>
    <div class="inner-tabs">
      <button class="inner-tab-btn active" data-inner="stems-extract">Nyx-Step Extract</button>
      <button class="inner-tab-btn" data-inner="stems-demucs">Demucs Separate</button>
      <button class="inner-tab-btn" data-inner="stems-join">Join Stems</button>
    </div>
    <div class="inner-panel active" id="stems-extract">
      <div class="field-group" data-dropzone="stems-file" style="border:1px solid transparent;border-radius:4px;padding:4px" title="Drag &amp; drop audio file here">
        <label>Input Audio File</label>
        <input type="file" id="stems-file" accept="audio/*">
      </div>
      <div class="field-group">
        <label>Song Name</label>
        <input type="text" id="stems-song-name" placeholder="Stem Extract">
      </div>
      <button id="btn-stems-extract">Send Extract Job to ComfyUI</button>
      <div id="stems-extract-status" style="margin-top:8px;font-size:12px;color:var(--muted)"></div>
    </div>
    <div class="inner-panel" id="stems-demucs">
      <div class="field-group">
        <label>Audio File</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input type="text" id="demucs-filename" placeholder="e.g. ComfyUI_00001_.mp3" style="flex:1;min-width:180px">
          <button class="secondary small" id="btn-demucs-browse-server" title="Browse ComfyUI output files on server">🖥 Server Files</button>
          <button class="secondary small" id="btn-demucs-browse-local" title="Upload a file from your computer">📁 Browse…</button>
          <input type="file" id="demucs-local-file" accept="audio/*" style="display:none">
        </div>
        <div id="demucs-server-list" style="display:none;margin-top:6px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;max-height:160px;overflow-y:auto"></div>
        <div id="demucs-upload-status" style="font-size:11px;color:var(--muted);margin-top:4px"></div>
      </div>
      <div class="field-group">
        <label>Model</label>
        <select id="demucs-model">
          <option value="htdemucs">4-stem (htdemucs)</option>
          <option value="htdemucs_6s">6-stem (htdemucs_6s)</option>
          <option value="htdemucs_ft" title="Fine-tuned 4-stem — better quality, slower">4-stem fine-tuned (htdemucs_ft)</option>
          <option value="mdx_extra" title="MDX-Net extra — strong vocal isolation">MDX-Net Extra (mdx_extra)</option>
        </select>
      </div>
      <button id="btn-demucs-run">Separate</button>
      <div id="demucs-stem-links" style="margin-top:10px"></div>
      <div id="demucs-log" class="log-panel" style="margin-top:8px"></div>
    </div>
    <div class="inner-panel" id="stems-join">
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px">Upload up to 4 stem audio files (vocals, drums, bass, other, etc.) and mix them into a single track. The stems are overlaid in parallel — shorter files are padded with silence.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div class="field-group" data-dropzone="join-stem1" style="border:1px solid transparent;border-radius:4px;padding:4px">
          <label>Stem 1</label>
          <input type="file" id="join-stem1" accept="audio/*">
        </div>
        <div class="field-group" data-dropzone="join-stem2" style="border:1px solid transparent;border-radius:4px;padding:4px">
          <label>Stem 2</label>
          <input type="file" id="join-stem2" accept="audio/*">
        </div>
        <div class="field-group" data-dropzone="join-stem3" style="border:1px solid transparent;border-radius:4px;padding:4px">
          <label>Stem 3</label>
          <input type="file" id="join-stem3" accept="audio/*">
        </div>
        <div class="field-group" data-dropzone="join-stem4" style="border:1px solid transparent;border-radius:4px;padding:4px">
          <label>Stem 4</label>
          <input type="file" id="join-stem4" accept="audio/*">
        </div>
      </div>
      <div class="field-group">
        <label>Output Song Name</label>
        <input type="text" id="join-song-name" value="Joined Stems" class="w100">
      </div>
      <button id="btn-stems-join">Mix Stems</button>
      <div id="stems-join-status" style="margin-top:8px;font-size:12px;color:var(--muted)"></div>
    </div>
