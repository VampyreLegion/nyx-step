  <div class="tab-panel" id="tab-style">
    <div class="panel-toolbar">
      <button class="secondary small" id="btn-open-tag-library" title="Tag Library — your saved tag combos; click one to load it into the Tags field">📚 Tag Library</button>
      <button class="secondary small" onclick="openGuideSection('scale')" title="Open Scales &amp; Modes guide">📖 Guide</button>
    </div>
    <div class="field-group">
      <input type="text" id="genre-search" placeholder="🔍 Search genres…">
    </div>
    <div style="display:flex;height:260px;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:10px">
      <div id="genre-categories" style="width:140px;overflow-y:auto;border-right:1px solid var(--border);flex-shrink:0"></div>
      <div id="genre-grid" style="flex:1;overflow-y:auto;padding:8px"></div>
    </div>
    <div id="genre-info" style="font-size:12px;color:var(--muted);margin-bottom:10px;min-height:16px">Select a genre above.</div>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <button onclick="detectGenre()" class="secondary small" title="AI-detect matching genres from current tags">🔍 Auto-Detect Genre</button>
      <span id="auto-genre-status" style="font-size:11px;color:var(--muted);align-self:center"></span>
    </div>
    <div class="row">
      <div class="field-group">
        <label>BPM</label>
        <input type="number" id="style-bpm" value="120" min="40" max="300">
      </div>
      <div class="field-group">
        <label>Key</label>
        <select id="style-key">
          <option>C</option><option>C#</option><option>D</option><option>D#</option>
          <option>E</option><option>F</option><option>F#</option><option>G</option>
          <option>G#</option><option>A</option><option>A#</option><option>B</option>
        </select>
      </div>
      <div class="field-group">
        <label>Scale</label>
        <select id="style-scale">
          <optgroup label="Standard">
            <option>Major</option>
            <option>Minor</option>
            <option>Harmonic Minor</option>
            <option>Melodic Minor</option>
          </optgroup>
          <optgroup label="Pentatonic / Blues">
            <option>Pentatonic Major</option>
            <option>Pentatonic Minor</option>
            <option>Blues</option>
            <option>Blues Major</option>
          </optgroup>
          <optgroup label="Symmetric">
            <option>Whole Tone</option>
            <option>Diminished</option>
            <option>Chromatic</option>
          </optgroup>
          <optgroup label="World / Exotic">
            <option>Hungarian Minor</option>
            <option>Double Harmonic Major</option>
            <option>Phrygian Dominant</option>
            <option>Neapolitan Minor</option>
            <option>Neapolitan Major</option>
            <option>Persian</option>
            <option>Enigmatic</option>
          </optgroup>
          <optgroup label="Jazz">
            <option>Bebop Major</option>
            <option>Bebop Dominant</option>
            <option>Acoustic</option>
            <option>Altered</option>
          </optgroup>
        </select>
      </div>
      <div class="field-group">
        <label>Mode</label>
        <select id="style-mode">
          <option value="">—</option>
          <optgroup label="Church Modes">
            <option>Ionian</option>
            <option>Dorian</option>
            <option>Phrygian</option>
            <option>Lydian</option>
            <option>Mixolydian</option>
            <option>Aeolian</option>
            <option>Locrian</option>
          </optgroup>
          <optgroup label="Jazz Modes">
            <option>Lydian Dominant</option>
            <option>Super Locrian</option>
            <option>Lydian Augmented</option>
            <option>Phrygian Dominant</option>
            <option>Half-Diminished</option>
          </optgroup>
          <optgroup label="Ethnic / Other">
            <option>Ukrainian Dorian</option>
            <option>Bhairav</option>
            <option>Bhairavi</option>
            <option>Yaman</option>
            <option>Kafi</option>
            <option>Hijaz</option>
          </optgroup>
        </select>
      </div>
      <div class="field-group">
        <label>Time</label>
        <select id="style-timesig">
          <option>4/4</option><option>3/4</option><option>6/8</option>
          <option>5/4</option><option>7/8</option><option>2/4</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field-group">
        <label title="Chord progression using Roman numerals, note names, or Nashville notation. e.g. Am - F - C - G  or  i - VI - III - VII  or  1 - 4 - 5. Appended to the generation tags.">Chord Progression <span class="hint">(optional)</span></label>
        <select id="style-chords-preset" style="margin-bottom:5px" title="Pick a preset or type your own below">
          <option value="">— pick a preset —</option>
          <optgroup label="Pop">
            <option value="I - V - vi - IV">I - V - vi - IV (classic pop)</option>
            <option value="I - IV - V - I">I - IV - V - I (basic pop)</option>
            <option value="vi - IV - I - V">vi - IV - I - V (minor-feel pop)</option>
            <option value="I - vi - IV - V">I - vi - IV - V (50s pop)</option>
            <option value="I - V - vi - iii - IV">I - V - vi - iii - IV (extended pop)</option>
            <option value="ii - V - I">ii - V - I (jazz pop turnaround)</option>
          </optgroup>
          <optgroup label="Rock">
            <option value="I - IV - V">I - IV - V (12-bar rock)</option>
            <option value="i - VII - VI - VII">i - VII - VI - VII (minor rock anthem)</option>
            <option value="I - bVII - IV - I">I - bVII - IV - I (power rock)</option>
            <option value="i - VI - III - VII">i - VI - III - VII (epic rock)</option>
            <option value="I - IV - bVII - IV">I - IV - bVII - IV (mixolydian rock)</option>
            <option value="I - V - IV - V">I - V - IV - V (blues-rock)</option>
          </optgroup>
          <optgroup label="Electronic / Dance">
            <option value="i - VI - III - VII">i - VI - III - VII (trance anthem)</option>
            <option value="i - VII - VI - VII">i - VII - VI - VII (progressive house)</option>
            <option value="i - iv - VII - III">i - iv - VII - III (dark techno loop)</option>
            <option value="I - II - IV - I">I - II - IV - I (euphoric EDM)</option>
            <option value="i - i - VI - VII">i - i - VI - VII (minimal loop)</option>
            <option value="I - iii - IV - V">I - iii - IV - V (uplifting trance)</option>
            <option value="vi - V - IV - III">vi - V - IV - III (descending EDM)</option>
          </optgroup>
          <optgroup label="R&B / Soul / Funk">
            <option value="IVmaj7 - iii7 - ii7 - I7">IVmaj7 - iii7 - ii7 - I7 (neo-soul)</option>
            <option value="i7 - IV7 - i7 - IV7">i7 - IV7 (funk groove)</option>
            <option value="ii7 - V7 - Imaj7 - VImaj7">ii7 - V7 - Imaj7 - VImaj7 (smooth R&B)</option>
            <option value="I - bIII - IV - bVII">I - bIII - IV - bVII (soulful)</option>
            <option value="i - VI - i - V">i - VI - i - V (moody R&B)</option>
          </optgroup>
          <optgroup label="Jazz">
            <option value="IIm7 - V7 - Imaj7">IIm7 - V7 - Imaj7 (jazz ii-V-I)</option>
            <option value="Imaj7 - VIm7 - IIm7 - V7">Imaj7 - VIm7 - IIm7 - V7 (rhythm changes)</option>
            <option value="IIm7b5 - V7 - Im">IIm7b5 - V7 - Im (minor ii-V-i)</option>
            <option value="I7 - IV7 - I7 - V7">I7 - IV7 - I7 - V7 (12-bar jazz blues)</option>
            <option value="IIIm7 - VI7 - IIm7 - V7">IIIm7 - VI7 - IIm7 - V7 (bird changes)</option>
          </optgroup>
          <optgroup label="Film / Cinematic">
            <option value="i - bVI - bIII - bVII">i - bVI - bIII - bVII (epic cinematic)</option>
            <option value="I - bVII - bVI - bVII">I - bVII - bVI - bVII (heroic theme)</option>
            <option value="i - bVII - bVI - V">i - bVII - bVI - V (dramatic tension)</option>
            <option value="I - iii - vi - IV">I - iii - vi - IV (emotional score)</option>
            <option value="i - iv - bVII - bIII">i - iv - bVII - bIII (dark orchestral)</option>
            <option value="Imaj7 - IVmaj7 - bVIImaj7 - bIIImaj7">Imaj7 - IVmaj7 - bVIImaj7 - bIIImaj7 (dreamy film)</option>
          </optgroup>
          <optgroup label="Metal / Heavy">
            <option value="i - bVI - bVII - i">i - bVI - bVII - i (power metal)</option>
            <option value="i - bVII - bVI - bVII">i - bVII - bVI - bVII (thrash riff)</option>
            <option value="i - iv - i - V">i - iv - i - V (doom metal)</option>
            <option value="i - bII - i - bVII">i - bII - i - bVII (phrygian metal)</option>
          </optgroup>
          <optgroup label="Ambient / Experimental">
            <option value="Imaj7 - IVmaj7">Imaj7 - IVmaj7 (floating two-chord)</option>
            <option value="i - bVII">i - bVII (dark ambient drone)</option>
            <option value="I - II">I - II (lydian float)</option>
            <option value="i - bII - bVII - i">i - bII - bVII - i (modal mystery)</option>
          </optgroup>
        </select>
        <input type="text" id="style-chords" placeholder="e.g. Am - F - C - G  or  i - VI - III - VII"
          title="Chord progression to guide the harmonic structure. Use note names, Roman numerals, or Nashville numbers.">
      </div>
      <div class="field-group">
        <label title="Key notes, melodic phrases, or scale degrees to emphasise. e.g. 'root on A2, emphasise 5th and minor 7th' or 'pentatonic run on E'. Appended to tags.">Notes / Melody Hint <span class="hint">(optional)</span></label>
        <input type="text" id="style-notes" placeholder="e.g. root on A2, emphasise 5th and minor 7th"
          title="Specific notes, intervals, or melodic hints to guide the model. Appended to generation tags.">
      </div>
    </div>
