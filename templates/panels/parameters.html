  <div class="tab-panel" id="tab-parameters">
    <div class="panel-toolbar">
      <button class="secondary small" onclick="openGuideSection('ch6')" title="Open Operations guide">📖 Guide</button>
    </div>
    <div class="row">
      <div class="field-group">
        <label title="How many diffusion sampling steps Nyx-Step runs. Each step refines the audio closer to your prompt. More steps = higher fidelity and detail but slower generation. 8 is fast for testing; 20–30 for quality results; 50+ for maximum quality. Diminishing returns above ~30. Default: 8. Range: 1–100.">Steps ⓘ</label>
        <input type="number" id="param-steps" value="8" min="1" max="100"
          title="Diffusion steps: each step refines the audio toward your prompt. 8 = fast preview. 20–30 = quality. 50+ = max quality (slow). Diminishing returns above ~30. Default: 8.">
      </div>
      <div class="field-group">
        <label title="Classifier-Free Guidance (CFG) scale — controls how tightly the model follows your tags and prompt. Too low (below 1.0) = ignores prompt, sounds random. Too high (above 5.0) = over-saturated, mechanical, may introduce artifacts. Sweet spot: 1.5–3.0. Default: 2.0. Range: 0.1–20.">CFG Scale ⓘ</label>
        <input type="number" id="param-cfg" value="2.0" step="0.1" min="0.1" max="20"
          title="CFG Scale: prompt adherence strength. &lt;1.0 = ignores prompt. 1.5–3.0 = balanced (recommended). 5.0+ = very literal, can sound over-processed. Default: 2.0.">
      </div>
      <div class="field-group">
        <label title="Length of the generated audio clip in seconds. Longer clips take more time and GPU memory proportionally. Nyx-Step supports up to ~5 minutes (300s). Default: 160. Range: 5–300.">Duration (s) ⓘ</label>
        <input type="number" id="param-duration" value="160" step="1" min="5" max="300"
          title="Audio length in seconds. Longer = more VRAM and time. 160s default. Max ~300s.">
      </div>
      <div class="field-group">
        <label title="Generate multiple variations in one job. Each variation uses a different random seed. All results appear as separate job cards. 1–4 recommended; higher values use proportionally more VRAM. Default: 1.">Batch ⓘ</label>
        <input type="number" id="param-batch-size" value="1" min="1" max="8" step="1"
          title="Batch size: generate N variations simultaneously. Each gets its own seed and job card. More = more VRAM. Default: 1.">
      </div>
    </div>
    <div style="margin-top:12px;padding:10px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:normal"
          title="Variance Protocol: when enabled, Nyx submits N individual workflows with randomized seeds, CFG, denoise, and prompt variants from the NyxStudio-Config.json library. Each take is musically distinct.">
          <input type="checkbox" id="param-variance-mode"> 🎲 Variance Protocol
        </label>
        <span class="hint">Variations:</span>
        <input type="number" id="param-variance-count" value="3" min="1" max="8" step="1" style="width:60px"
          title="Number of distinct variant workflows to submit (1–8). Each gets randomized seed, CFG, denoise, and prompt cycling.">
        <span class="hint" id="variance-hint">3 individual jobs with randomized params</span>
      </div>
    </div>
    <div class="row">
      <div class="field-group">
        <label title="Sampling temperature controls how much randomness is applied when selecting audio tokens. 0.0 = fully deterministic (robotic, repetitive). 0.85 = natural variation with coherence (recommended). 1.5+ = highly experimental and unpredictable — may lose musical structure. Think of it as how much the model 'improvises'. Default: 0.85. Range: 0–2.">Temperature ⓘ</label>
        <input type="number" id="param-temp" value="0.85" step="0.01" min="0" max="2"
          title="Temperature: 0 = robotic/deterministic. 0.85 = natural and coherent (recommended). 1.5+ = very experimental, may lose structure. Controls how much the model improvises. Default: 0.85.">
      </div>
      <div class="field-group">
        <label title="Top-P (nucleus sampling): at each generation step, only tokens whose cumulative probability adds up to P are considered. 0.9 = considers the most probable 90% of options. Lower (0.5) = safer, more conservative output. 1.0 = no filtering, all tokens eligible. Combine with Temperature for fine control. Default: 0.9.">Top-P ⓘ</label>
        <input type="number" id="param-topp" value="0.9" step="0.01" min="0" max="1"
          title="Top-P nucleus sampling: only tokens in the top P% of probability mass are sampled. 0.9 = broad but focused. 0.5 = very conservative. 1.0 = disabled. Default: 0.9.">
      </div>
      <div class="field-group">
        <label title="Top-K sampling: at each step, only the K most probable tokens are eligible for selection. 0 = disabled (no limit). 50 = only the 50 best options are considered. Lower K = more focused and predictable. Can be combined with Top-P. Usually leave at 0 for Nyx-Step. Default: 0.">Top-K ⓘ</label>
        <input type="number" id="param-topk" value="0" min="0"
          title="Top-K: limits sampling to the K most probable tokens. 0 = disabled. 50 = top 50 only. Lower = more focused. Leave at 0 unless you want to constrain output tightly. Default: 0.">
      </div>
      <div class="field-group">
        <label title="Min-P dynamically filters tokens whose probability falls below P × (probability of the best token). This removes low-quality outliers without being as rigid as Top-K. 0.0 = disabled. 0.05 = removes tokens less than 5% as likely as the top choice. Helps prevent incoherent output, especially at higher temperatures. Default: 0.0.">Min-P ⓘ</label>
        <input type="number" id="param-minp" value="0.0" step="0.01" min="0" max="1"
          title="Min-P: removes tokens below P × top-token probability. 0 = disabled. 0.05 = filters out very unlikely tokens. Good pairing with higher Temperature to prevent gibberish. Default: 0.0.">
      </div>
    </div>
    <div class="row">
      <div class="field-group">
        <label title="The random seed that initialises Nyx-Step's generation. Same seed + same parameters = identical output every time — use this to reproduce a result or A/B test a single parameter change. 0 = always generate a new random seed (true random each run). IMPORTANT: Lock Seed must also be checked AND seed must be non-zero for a seed to be reused. Use the 🎲 button to pick and lock a random seed instantly. Default: 0 (always random).">Seed ⓘ</label>
        <div style="display:flex;gap:6px">
          <input type="number" id="param-seed" value="0" style="flex:1"
            title="Seed: 0 = random every time. Non-zero + Lock Seed checked = reproducible. Same seed + same params = identical output. Use 🎲 to auto-generate and lock a seed.">
          <button class="secondary small" id="btn-random-seed" title="Generate a random non-zero seed and enable Lock Seed">🎲</button>
        </div>
      </div>
      <div class="field-group" style="display:flex;align-items:flex-end">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"
          title="When checked AND seed is non-zero: the same seed is reused every generation for reproducible results. When unchecked OR seed is 0: a new random seed is generated each time. NOTE: seed=0 always randomises even if locked — use 🎲 to set a real seed first.">
          <input type="checkbox" id="param-lock-seed"> Lock seed
        </label>
      </div>
    </div>
    <div class="row">
      <div class="field-group">
        <label title="Language of the vocals. Auto = model detects from lyrics. Set explicitly to prevent mis-detection, especially for non-English lyrics.">Vocal Language ⓘ</label>
        <select id="param-vocal-language" title="Vocal language — auto lets the model detect from lyrics; set explicitly for non-English songs">
          <option value="auto">Auto (detect)</option>
          <option value="en">English</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="pt">Portuguese</option>
          <option value="it">Italian</option>
          <option value="ru">Russian</option>
          <option value="ar">Arabic</option>
          <option value="hi">Hindi</option>
        </select>
      </div>
      <div class="field-group">
        <label title="Output audio format. MP3: universal, smaller files. FLAC: lossless, larger files, best for post-production. Opus: modern lossy, excellent quality at low bitrates.">Format ⓘ</label>
        <select id="param-audio-format" title="Output format: MP3 (universal), FLAC (lossless), Opus (efficient)">
          <option value="mp3">MP3</option>
          <option value="flac">FLAC (lossless)</option>
          <option value="opus">Opus</option>
        </select>
      </div>
      <div class="field-group" id="param-quality-wrap">
        <label title="Bitrate or quality setting for the selected format. V0 = best variable-bitrate MP3. 320k = highest constant bitrate.">Quality ⓘ</label>
        <select id="param-audio-quality" title="Bitrate/quality for the selected format">
          <option value="V0">V0 (best VBR)</option>
          <option value="128k">128k</option>
          <option value="320k">320k</option>
        </select>
      </div>
    </div>
    <div style="margin-top:12px;padding:10px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
      <div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px">Model</div>
      <div class="row" style="gap:12px">
        <div class="field-group">
          <label style="font-size:12px" title="DiT (diffusion) model. Turbo: 8 steps, fastest. SFT: 50 steps, highest quality. Base: 50 steps, full mode support (Lego/Extract/Complete). Changing model updates the recommended step count.">DiT Model ⓘ</label>
          <select id="param-dit-model" title="Turbo=fast (8 steps), SFT=quality (50 steps), Base=full capabilities (50 steps)">
            <option value="turbo">XL Turbo (8 steps — fast)</option>
            <option value="sft">XL SFT (50 steps — quality)</option>
            <option value="base">XL Base (50 steps — full modes)</option>
          </select>
        </div>
        <div class="field-group" style="display:flex;align-items:flex-end">
          <span id="param-model-hint" class="hint">Recommended: 8 steps, CFG 2.0</span>
        </div>
      </div>
    </div>
    <div style="margin-top:12px;padding:10px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:12px;font-weight:600;color:var(--accent)">LM Stage</div>
        <button class="secondary small" onclick="openGuideSection('lm')" title="Open LM Stage guide" style="font-size:10px;padding:1px 6px">📖</button>
      </div>
      <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:12px"
        title="Enable the 5Hz Language Model that pre-generates audio codes before diffusion. When ON: higher quality, slower start (~10–30s overhead). When OFF: faster but lower coherence — use when providing a reference audio. Default: ON.">
        <input type="checkbox" id="param-gen-audio-codes" checked style="margin-top:2px">
        <span>Enable LM / Audio Codes Stage <span style="color:var(--muted);font-size:11px">— pre-generates 5Hz semantic codes; improves coherence but adds ~10–30s overhead</span></span>
      </label>
    </div>
    <div style="margin-top:12px;padding:10px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-size:12px;font-weight:600;color:var(--accent)">LoRA</span>
        <button class="secondary small" id="btn-lora-refresh" title="Reload LoRA list from ComfyUI" style="font-size:10px;padding:1px 6px">↺</button>
        <span id="lora-count" class="hint"></span>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px">LoRA 1</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <select id="param-lora-name" style="flex:1;min-width:160px;font-size:12px" title="Select a LoRA to apply. Empty = no LoRA.">
          <option value="">None</option>
        </select>
        <div class="field-group" style="min-width:90px">
          <label style="font-size:11px" title="LoRA influence strength (0=off, 1=full). Applied to both model and CLIP.">Scale ⓘ</label>
          <input type="number" id="param-lora-scale" value="1.0" min="0" max="2" step="0.05" style="width:70px">
        </div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px">LoRA 2 <span style="color:var(--muted);font-size:10px">(stacked — applied after LoRA 1)</span></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <select id="param-lora2-name" style="flex:1;min-width:160px;font-size:12px" title="Optional second LoRA. Both LoRAs are chained in series.">
          <option value="">None</option>
        </select>
        <div class="field-group" style="min-width:90px">
          <label style="font-size:11px" title="Second LoRA influence strength.">Scale ⓘ</label>
          <input type="number" id="param-lora2-scale" value="1.0" min="0" max="2" step="0.05" style="width:70px">
        </div>
      </div>
      <div style="margin-top:12px">
        <div class="field-group">
          <label title="Qualities to steer away from during generation. Uses CFG negative conditioning.">🚫 Avoid (negative tags) ⓘ <span id="param-negative-hint" class="hint">Comma-separated qualities to steer away from, e.g. vocals, harsh treble. Experimental.</span></label>
          <input id="param-negative-tags" type="text" placeholder="vocals, muddy bass, distortion" class="w100">
        </div>
      </div>
    </div>
    <div style="margin-top:10px">
      <button class="secondary small" id="btn-reset-params" title="Reset all generation parameters to their default values">↺ Reset to Defaults</button>
