# Nyx-Step lint configuration.
#
# Only the correctness-level rules are enforced here (E9 = syntax/runtime
# breakage, F63/F7/F82 = undefined names, star-import collisions, undefined
# local references).  Stylistic rules (E1xx, I0xx, …) are deliberately NOT
# gated in CI — the codebase has hundreds of pre-existing style issues and
# gating on them would block every change.  Run `ruff check .` locally if you
# want the full style report.

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]