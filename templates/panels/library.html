  <div class="tab-panel" id="tab-library">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <input type="text" id="library-search" placeholder="Filter by filename…" style="flex:1;min-width:200px;font-size:12px">
      <button class="secondary small" id="btn-library-refresh" title="Rescan output/audio for MP3s">↺ Refresh</button>
      <span id="library-count" style="color:var(--muted);font-size:12px"></span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:10px;position:sticky;top:0;z-index:5">
      <audio id="library-audio" controls style="flex:1;height:34px"></audio>
      <span id="library-now-playing" style="color:var(--accent2);font-size:12px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    </div>
    <div id="library-list" style="display:flex;flex-direction:column;gap:4px"></div>
    <div id="library-empty" style="color:var(--muted);font-size:13px;display:none;padding:12px 0">No MP3 files found in ComfyUI output/audio.</div>
