  <div class="tab-panel" id="tab-midi">
    <div class="panel-toolbar">
      <button class="secondary small" onclick="openGuideSection('midi')" title="Open MIDI guide">📖 Guide</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;max-width:600px">
      <p style="margin:0;font-size:12px;color:var(--muted)">Extract MIDI notes from any audio file. <strong>Melody</strong> mode uses librosa pyin (monophonic, works on any instrument). <strong>Piano</strong> mode uses a neural polyphonic transcriber (piano recordings).</p>

      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <label style="font-size:12px">Mode</label>
        <select id="midi-mode" style="font-size:12px">
          <option value="melody">Melody (any instrument — monophonic)</option>
          <option value="piano">Piano (polyphonic — neural)</option>
        </select>
      </div>

      <div id="midi-bpm-row" style="display:flex;gap:10px;align-items:center">
        <label style="font-size:12px">BPM</label>
        <input type="number" id="midi-bpm" value="120" min="40" max="300" step="1" style="width:80px;font-size:12px" title="Tempo used to set MIDI grid — use Analyze tab to detect BPM first">
        <span class="hint">tip: run Analyze first to detect BPM</span>
      </div>

      <div data-dropzone="midi-file" style="display:flex;gap:10px;align-items:center;padding:4px;border:1px solid transparent;border-radius:4px" title="Drag &amp; drop audio file here">
        <label style="font-size:12px">Audio file</label>
        <input type="file" id="midi-file" accept="audio/*" style="flex:1;font-size:12px">
      </div>

      <button id="btn-midi-extract" style="align-self:flex-start">Extract MIDI</button>

      <div id="midi-status" style="font-size:12px;color:var(--muted);min-height:16px"></div>
      <div id="midi-info" style="display:none;font-size:12px;background:var(--surface3,#1e1e1e);border-radius:4px;padding:8px;line-height:1.8"></div>
      <a id="midi-download" style="display:none;font-size:13px;color:var(--accent)"></a>
    </div>
