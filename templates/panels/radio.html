  <div class="tab-panel" id="tab-radio">

    <!-- Mode toggle -->
    <div style="display:flex;gap:0.5rem;margin-bottom:1rem;border-bottom:1px solid var(--border);padding-bottom:0.75rem">
      <button id="radio-mode-manual" class="secondary small" style="font-size:12px;padding:4px 14px;border:2px solid var(--accent);color:var(--accent)" title="You set the style; AI writes a full song with lyrics for each segment">🎛 Manual</button>
      <button id="radio-mode-auto" class="secondary small" style="font-size:12px;padding:4px 14px" title="AI DJ picks styles and writes complete songs autonomously">🤖 Auto DJ</button>
    </div>

    <!-- Manual mode panel -->
    <div id="radio-panel-manual">
      <div class="field-group" style="margin-bottom:0.75rem">
        <label title="Describe the music style; Ollama generates a complete song with lyrics and vocals for each segment">Style Description</label>
        <input type="text" id="radio-tags" placeholder="e.g. lo-fi hip hop, jazzy piano, female vocals, mellow, 75 BPM" class="w100">
      </div>
    </div>

    <!-- Auto DJ panel -->
    <div id="radio-panel-auto" style="display:none">
      <div class="field-group" style="margin-bottom:0.5rem">
        <label>Genre</label>
        <select id="radio-genre-select" style="font-size:12px;width:100%">
          <option value="">— pick a genre —</option>
        </select>
        <div id="radio-genre-info" style="font-size:11px;color:var(--muted);margin-top:4px;min-height:14px"></div>
      </div>
      <div class="field-group" style="margin-bottom:0.75rem">
        <label title="Style tags sent to Ollama. Filled from genre picker above — edit freely or leave blank for fully random.">Style Prompt <span style="color:var(--muted);font-weight:normal;font-size:0.85em">(editable — blank = fully random)</span></label>
        <div style="display:flex;gap:0.5rem;align-items:center">
          <input type="text" id="radio-style-override" placeholder="e.g. jazz, synthwave, indie folk…" style="flex:1">
          <button id="radio-dj-choice" class="secondary small" title="Ask the AI DJ to invent a style">🎙 DJ Choice</button>
          <button id="radio-random-style" class="secondary small" title="Pick a random style from the DJ library">🎲 Random</button>
        </div>
      </div>
    </div>

    <!-- Shared settings -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-bottom:1rem">
      <div class="field-group">
        <label title="BPM — all segments will target this tempo">BPM</label>
        <input type="number" id="radio-bpm" value="90" min="40" max="240" step="1" style="width:80px">
      </div>
      <div class="field-group">
        <label title="Duration of each segment in seconds">Segment Length (s)</label>
        <input type="number" id="radio-duration" value="160" min="10" max="300" step="5" style="width:80px">
      </div>
      <div class="field-group">
        <label title="Key for all segments">Key</label>
        <select id="radio-key" style="font-size:12px">
          <option>C</option><option>C#</option><option>D</option><option>D#</option>
          <option>E</option><option>F</option><option>F#</option><option>G</option>
          <option>G#</option><option>A</option><option>A#</option><option>B</option>
        </select>
      </div>
      <div class="field-group">
        <label title="Scale for all segments">Scale</label>
        <select id="radio-scale" style="font-size:12px">
          <option>Major</option><option>Minor</option>
        </select>
      </div>
      <div class="field-group">
        <label title="Diffusion steps — 8 for turbo model; 20–30 for SFT model">Steps</label>
        <input type="number" id="radio-steps" value="8" min="4" max="60" step="1" style="width:70px">
      </div>
      <div class="field-group">
        <label title="Time signature — affects rhythmic feel">Time Sig</label>
        <select id="radio-timesig" style="font-size:12px">
          <option value="4/4" selected>4/4</option>
          <option value="3/4">3/4 (waltz)</option>
          <option value="6/8">6/8</option>
          <option value="5/4">5/4</option>
          <option value="7/8">7/8</option>
        </select>
      </div>
      <div class="field-group">
        <label title="Creativity (temperature) — higher = more variation, less repetition">Temperature</label>
        <input type="number" id="radio-temperature" value="0.85" min="0.7" max="1.3" step="0.05" style="width:65px">
      </div>
      <div class="field-group">
        <label title="Number of segments to buffer before playback starts — prevents gaps">Buffer (segments)</label>
        <input type="number" id="radio-buffer" value="2" min="1" max="5" step="1" style="width:60px">
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
      <button id="btn-radio-toggle" title="Start the radio stream">📻 Start Radio</button>
    </div>
    <div id="radio-status" style="margin-top:8px;font-size:12px;color:var(--muted)"></div>

    <!-- Mini Player -->
    <div style="margin-top:16px;background:var(--surface2);border-radius:6px;padding:14px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Now Playing</div>
      <div id="radio-now-playing" style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;min-height:20px">—</div>
      <div id="radio-style-display" style="font-size:11px;color:var(--muted);margin-bottom:8px;min-height:14px;font-style:italic"></div>
      <audio id="radio-audio" style="width:100%;margin-bottom:6px" controls preload="auto"></audio>
      <div id="radio-progress" style="font-size:11px;color:var(--muted);text-align:right"></div>
    </div>

    <!-- Segment history -->
    <div style="margin-top:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Segment History</div>
        <button id="btn-radio-clear-history" class="secondary small" style="font-size:10px;padding:2px 8px" title="Clear segment history list">🗑 Clear</button>
      </div>
      <div id="radio-history" style="max-height:220px;overflow-y:auto"></div>
    </div>
