name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (demucs excluded — torch is too heavy for CI and is only shelled out at runtime)
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg
          grep -v "^demucs" requirements.txt > /tmp/ci-requirements.txt
          pip install -r /tmp/ci-requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q
